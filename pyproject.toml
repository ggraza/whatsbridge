[project]
name = "whatsbridge"
authors = [
    { name = "G2Virtu.com", email = "info@g2virtu.com"}
]
description = "WhatsBridge - WhatsApp Integration and Communication Platform for Frappe and ERP"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

[tool.bench.frappe-dependencies]
frappe = ">=14.0.0,<17.0.0"

dependencies = [
    # "frappe~>=14.0.0" # Installed and managed by bench.
    # frappe = ">=14.0.0-dev,<17.0.0"
]
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

